services:
  web:
    build: .
    ports:
      - "4321:4321"
    environment:
      # Server-only configuration (see .env.example).
      - SITE_URL=http://localhost:4321
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:4321/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
